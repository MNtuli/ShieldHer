<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trusted contacts - ShieldHer</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/theme.js"></script>
</head>
<body>
<header class="bar">
    <a class="brand" href="index.html">ShieldHer</a>
    <nav><a href="dashboard.html">SOS</a>  <a href="resources.html">Support</a>  <button type="button" id="logout-btn">Log out</button></nav>
</header>
<main>
    <h1>Trusted contacts</h1>
    <p class="muted">These people are alerted when you press SOS.</p>

    <div id="status" role="status" aria-live="polite"></div>

    <form id="contact-form" class="card" novalidate>
        <h2 id="form-title">Add a contact</h2>
        <label for="name">Name</label>
        <input id="name" name="name" maxlength="100" autocomplete="off" aria-describedby="err-name">
        <p class="field-error" id="err-name" hidden></p>

        <label for="phone">Phone number</label>
        <input id="phone" name="phone" type="tel" maxlength="20" autocomplete="off" aria-describedby="err-phone">
        <p class="field-error" id="err-phone" hidden></p>

        <label for="email">Email (optional)</label>
        <input id="email" name="email" type="email" maxlength="254" autocomplete="off" aria-describedby="err-email">
        <p class="field-error" id="err-email" hidden></p>

        <label for="relationship">Relationship (optional)</label>
        <input id="relationship" name="relationship" maxlength="50" autocomplete="off" aria-describedby="err-relationship">
        <p class="field-error" id="err-relationship" hidden></p>

        <div class="actions form">
            <button class="primary" type="submit" id="save-btn">Add contact</button>
            <button class="secondary" type="button" id="cancel-btn" hidden>Cancel</button>
        </div>
    </form>

    <section class="card">
        <h2>Your contacts</h2>
        <p id="loading" class="muted">Loading contacts...</p>
        <div id="load-error" hidden>
            <p class="msg bad" id="load-error-text" role="alert"></p>
            <button class="secondary" type="button" id="retry-btn">Try again</button>
        </div>
        <p id="empty" class="muted" hidden>You have no trusted contacts yet. Add one above so SOS can reach someone.</p>
        <ul id="contacts" class="contacts"></ul>
    </section>
</main>
<script src="js/api.js"></script>
<script src="js/contacts.js"></script>
</body>
</html>

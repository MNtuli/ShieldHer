<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in - ShieldHer</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<main>
    <h1>ShieldHer</h1>
    <p class="muted">Log in to your account.</p>
    <form id="login-form" class="card" novalidate>
        <div id="error" class="msg bad" role="alert" hidden></div>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button class="primary" type="submit">Log in</button>
    </form>
    <p>No account? <a href="register.html">Register</a></p>
</main>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>

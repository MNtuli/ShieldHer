<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - ShieldHer</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<main>
    <h1>Create your account</h1>
    <form id="register-form" class="card" novalidate>
        <div id="error" class="msg bad" role="alert" hidden></div>
        <label for="fullName">Full name</label>
        <input id="fullName" name="fullName" autocomplete="name" required>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
        <label for="phoneNumber">Phone number</label>
        <input id="phoneNumber" name="phoneNumber" type="tel" autocomplete="tel" required>
        <label for="password">Password (6+ characters)</label>
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="6" required>
        <button class="primary" type="submit">Register</button>
    </form>
    <p>Already registered? <a href="login.html">Log in</a></p>
</main>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>

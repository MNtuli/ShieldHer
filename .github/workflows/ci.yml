name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: shieldher
          POSTGRES_PASSWORD: shieldher
          POSTGRES_DB: shieldher
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shieldher -d shieldher"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_URL: jdbc:postgresql://localhost:5432/shieldher
      DB_USERNAME: shieldher
      DB_PASSWORD: shieldher
      # throwaway key for CI only (never use in production)
      JWT_SECRET: Y2ktb25seS10aHJvd2F3YXktand0LXNlY3JldC1rZXktMzItYnl0ZXM=
      JWT_EXPIRATION_MS: "86400000"

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test
        run: |
          chmod +x mvnw
          ./mvnw -B verify

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports